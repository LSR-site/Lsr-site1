<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/logo.jpg" type="image/jpeg" />
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?{{fonts}}:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
{{css}}  </head>
  <body{{body}}>
    <div class="noise"></div>
{{bg}}    <div class="glow"></div>
    <div class="glow glow-2"></div>

    <header class="site-header">
      <div class="header-top">
        <div class="wrap header-top-inner">
          <a class="brand" href="/">
            <img class="brand-mark" src="/img/logo.jpg" alt="Los Santos Reborn" />
            <span data-edit="site.nom">Los Santos Reborn</span>
          </a>
          <div class="header-actions">
            <div id="authArea"></div>
            <a class="btn btn-gold btn-compact" href="https://discord.gg/bNDKVDSaz" target="_blank" rel="noreferrer">Discord</a>
            <button class="nav-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
          </div>
        </div>
      </div>
      <nav class="site-nav" id="siteNav">
        <div class="wrap nav-inner">
          <a href="/">Accueil</a>
          <a href="/tickets">Tickets</a>
          <a href="/whitelist">Whitelist</a>
          <a href="/casiers" data-staff-nav hidden>Casiers</a>
          <a href="/reglement">Règlement</a>
        </div>
      </nav>
    </header>

{{page}}
    <script src="/js/site.js"></script>
{{scripts}}  </body>
</html>
