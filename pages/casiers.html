    <main class="wrap rules-page">
      <header class="page-hero">
        <p class="breadcrumb"><a href="/">Accueil</a><span>/</span>Casiers</p>
        <p data-edit="casiers.surtitre" class="kicker">Staff uniquement</p>
        <div class="rules-head">
          <h1 data-edit="casiers.titre">Casiers joueurs</h1>
          <p class="muted" id="casierMeta">Les casiers restent après la WL. Commentaires et sanctions sont invisibles pour les joueurs.</p>
        </div>
      </header>

      <div id="casierGate" class="setup-box" hidden>
        <h2>Accès staff</h2>
        <p class="muted">Connecte-toi pour ouvrir un casier, ajouter un commentaire ou une sanction écrite.</p>
      </div>

      <div id="casierDesk">
        <div class="casier-toolbar">
          <input id="casierSearch" class="search" type="search" placeholder="Chercher un nom RP, un Discord ou un mot dans les notes…" />
          <div class="casier-filters">
            <div class="filter-chips" id="casierKinds"></div>
            <select id="casierStatus" class="search" aria-label="Statut WL">
              <option value="">Tous les statuts WL</option>
              <option value="pending">Demande</option>
              <option value="casier">En attente de vocal</option>
              <option value="accepted">WL ok</option>
              <option value="refused">Refusée</option>
              <option value="none">Sans WL liée</option>
            </select>
            <select id="casierSort" class="search" aria-label="Trier">
              <option value="recent">Dernière activité</option>
              <option value="number">Numéro de casier</option>
              <option value="sanctions">Plus de sanctions</option>
            </select>
          </div>
        </div>
        <div id="casierList" class="casier-grid"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© <span id="year"></span> Los Santos Reborn</p>
        <a href="/whitelist">Retour aux demandes WL</a>
      </div>
    </footer>
