    <main class="wrap rules-page">
      <header class="page-hero">
        <p class="breadcrumb"><a href="/">Accueil</a><span>/</span>Tickets</p>
        <p data-edit="tickets.surtitre" class="kicker">Support</p>
        <div class="rules-head">
          <h1 data-edit="tickets.titre">Tickets</h1>
          <p data-edit="tickets.intro" class="muted" id="ticketMeta">Ouvre un ticket ici, le staff te répond sur cette page.</p>
        </div>
      </header>

      <div class="ticket-desk">
        <aside class="ticket-side">
          <form id="ticketForm" class="ticket-create">
            <div class="ticket-create-head">
              <p class="kicker">Nouveau</p>
              <h2 data-edit="tickets.form-titre">Ouvrir un ticket</h2>
            </div>
            <label>Nom RP <input name="name" required minlength="2" maxlength="40" placeholder="Ex. Sofia Moreau" /></label>
            <div class="ticket-cat-picker">
              <p class="ticket-field-label">Catégorie</p>
              <input type="hidden" name="category" id="ticketCategory" value="" />
              <div id="ticketCategories" class="ticket-cats"></div>
            </div>
            <label>Sujet <input name="subject" required minlength="3" maxlength="120" placeholder="Ex. Bug de spawn" /></label>
            <label>Message
              <textarea name="content" rows="4" maxlength="1800" placeholder="Explique ta demande."></textarea>
            </label>
            <label>Photo <input name="image" type="url" placeholder="https://… image" /></label>
            <label>Lien <input name="link" type="url" placeholder="https://… page, vidéo, doc" /></label>
            <button class="btn btn-gold" type="submit">Ouvrir le ticket</button>
            <p class="muted" id="ticketError"></p>
          </form>
          <div>
            <p class="kicker">Tes tickets</p>
            <div id="ticketList" class="ticket-list"></div>
          </div>
        </aside>

        <section class="ticket-chat" id="threadBox">
          <div class="ticket-empty" id="threadEmpty">
            <img src="/img/logo.jpg" alt="" class="ticket-empty-logo" />
            <h2>Conversation</h2>
            <p data-edit="tickets.vide" class="muted">Choisis un ticket ou ouvres-en un. Tu peux envoyer du texte, une photo et un lien.</p>
          </div>
          <div id="threadView" hidden>
            <div class="ticket-thread-head">
              <div>
                <p class="kicker" id="threadCat"></p>
                <h2 id="threadTitle"></h2>
                <p class="muted" id="threadMeta"></p>
              </div>
              <button class="btn btn-ghost" id="closeTicket" type="button">Fermer</button>
            </div>
            <div class="ticket-thread" id="threadMessages"></div>
            <form id="replyForm" class="ticket-reply">
              <textarea name="content" rows="2" maxlength="1800" placeholder="Écrire un message…"></textarea>
              <div class="ticket-reply-row">
                <input name="image" type="url" placeholder="Lien photo https://…" />
                <input name="link" type="url" placeholder="Lien https://…" />
                <button class="btn btn-gold" type="submit">Envoyer</button>
              </div>
            </form>
            <p class="muted" id="replyError"></p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© <span id="year"></span> Los Santos Reborn</p>
        <div>
          <a href="/">Accueil</a>
          ·
          <a href="/whitelist">Whitelist</a>
          ·
          <a href="/reglement">Règlement</a>
        </div>
      </div>
    </footer>
